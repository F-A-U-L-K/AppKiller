name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Clean and Build APK
      run: ./gradlew assembleDebug --info --stacktrace --full-stacktrace
      # --info will give us the exact reason if it fails again

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AppKiller-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
