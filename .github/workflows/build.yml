name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.2

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Clean and Build APK
      # We combine clean and assembleDebug to ensure a fresh, successful build.
      # The -P flags solve the "AndroidX not enabled" error once and for all.
      run: ./gradlew clean assembleDebug -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true --stacktrace

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: AppKiller-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
