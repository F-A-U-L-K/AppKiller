name: Android CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Install modern Gradle manually (NOT Ubuntu repo)
      - name: Install Gradle 8.11.1
        run: |
          wget https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip gradle-8.11.1-bin.zip
          echo "$PWD/gradle-8.11.1 /bin" >> $GITHUB_PATH

      # Now generate wrapper using correct gradle
      - name: Generate Wrapper
        run: gradle wrapper

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppKiller-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
