name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.2

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Clean Build
      # This clears old cache and data to prevent exit code 162 errors
      run: ./gradlew clean

    - name: Build Debug APK
      # We force AndroidX and Jetifier here to fix your specific error
      # --stacktrace provides full details if it fails again
      run: ./gradlew assembleDebug -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true --stacktrace

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: AppKiller-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
