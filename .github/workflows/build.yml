name: Android CI
on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # THIS IS THE KEY: It provides Gradle 8.2.1 without needing your JAR file
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2.1

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        # We run 'gradle assembleDebug' directly instead of './gradlew' 
        # to ensure it uses the fresh version we just installed.
        run: ./gradlew assembleDebug --info --stacktrace

      # I ONLY ADDED THIS STEP BELOW TO SAVE THE FILE:
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppKiller-Debug-APK
          path: "**/*.apk"

          - name: Grant execute permission
  run: chmod +x gradlew
