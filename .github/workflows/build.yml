name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # This official action fixes the "no main manifest" and missing JAR issues
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.2.1

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Clean and Build APK
      # Using --info and --stacktrace to see exactly what happens inside
      run: ./gradlew assembleDebug --info --stacktrace --full-stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AppKiller-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
