name: Android CI
on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # This fixed the "Missing JAR" problem last time - keep it exactly like this
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2.1

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build APK
        # We use 'assembleDebug' because it is the fastest way to get an APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppKiller-App
          # This '**/*.apk' tells GitHub to search EVERY folder for the APK
          path: "**/*.apk"
          if-no-files-found: error
