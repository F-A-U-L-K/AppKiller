name: Android CI
on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2.1

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        # assembleDebug is the command that creates the actual APK file
        run: ./gradlew assembleDebug --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppKiller-Package
          # This '**/build/**/*.apk' finds the APK no matter where it is hidden
          path: "**/build/outputs/apk/debug/*.apk"
          # This makes the build fail if no APK is found, so we know immediately
          if-no-files-found: error
