name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      # remove gradle-version if you trust your wrapper

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew    # keep even after git chmod, harmless

    - name: Clean and Build APK
      run: ./gradlew clean assembleDebug --stacktrace --info

    - name: List APKs (debug)
      if: always()
      run: find . -name "*.apk" || true

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: AppKiller-Debug-APK
        path: |
          **/build/outputs/apk/debug/*.apk
