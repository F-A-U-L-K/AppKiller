name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # THIS STEP REPLACES THE MISSING JAR
    # It will automatically install a working Gradle version (8.2.1)
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.2.1

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Clean and Build APK
      # If the build still fails here, the logs will now show code errors 
      # instead of "Missing JAR" errors.
      run: ./gradlew assembleDebug --info --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AppKiller-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
