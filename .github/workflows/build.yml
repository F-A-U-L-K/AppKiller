name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Bootstrap Gradle Wrapper
      # This step downloads the official wrapper JAR directly from the source 
      # so you don't have to manually upload it to GitHub.
      run: |
        mkdir -p gradle/wrapper
        curl -L https://github.com/gradle/gradle/raw/v8.2.1/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Clean and Build APK
      # Detailed logging enabled to catch any subsequent library issues
      run: ./gradlew assembleDebug --info --stacktrace --full-stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AppKiller-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
